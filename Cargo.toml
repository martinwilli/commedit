[workspace]
resolver = "3"
members = [
    "crates/commedit-engine",
    "crates/commedit-gtk",
    "crates/commedit-mcp",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Martin Willi <martin@strongswan.org>"]

[workspace.dependencies]
jj-lib = "=0.43.0"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
